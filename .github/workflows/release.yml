name: Release

# Pushing a tag like v0.1.15 builds the plugin zip and attaches it to a GitHub release.
# Uploading to plugins.qgis.org is still a manual step (it needs your OSGeo login).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag must match the plugin version
        run: |
          version=$(sed -n 's/^version=//p' kentucky_stac/metadata.txt)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match metadata.txt version ${version}" >&2
            exit 1
          fi
      - run: python -m pip install ruff pytest
      - run: ruff check .
      - run: python -m pytest -q
      - run: python scripts/package.py --out-dir dist --notes release-notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          if grep -q '^experimental=True' kentucky_stac/metadata.txt; then flags="--prerelease"; fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip --clobber
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip --title "${GITHUB_REF_NAME}" \
              --notes-file release-notes.md ${flags}
          fi
