[project]
name = "kentucky-stac"
version = "0.2.0"
description = "QGIS plugin for Kentucky From Above imagery, DEM and LiDAR via STAC"
requires-python = ">=3.9"
license = "GPL-2.0-or-later"
dependencies = []  # runtime deps come from QGIS's Python; keep the plugin stdlib-only

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "qgis-plugin-ci",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = ["kentucky_stac/ext_libs"]

[tool.ruff.lint]
# Explicit so a ruff upgrade can't silently widen the ruleset: pyflakes, pycodestyle errors and
# warnings, import order, and exception hygiene (BLE001 blind except, S110/S112 silent except).
# A deliberate catch-all carries `# noqa: BLE001 - <why>` on its line.
select = ["E4", "E7", "E9", "F", "W", "I", "BLE", "S110", "S112"]

[tool.pytest.ini_options]
testpaths = ["tests"]
